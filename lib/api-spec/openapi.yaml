openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile-catalog
    description: Official profile metadata
paths:
  /profile-catalog:
    get:
      operationId: listProfileCatalog
      tags: [profile-catalog]
      summary: List official profile metadata
      responses:
        "200":
          description: Profile metadata catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileCatalogEntry"
        "500":
          description: Catalog could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile-catalog/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ProfileKind"
    put:
      operationId: updateProfileCatalog
      tags: [profile-catalog]
      summary: Update manager-editable profile metadata
      description: Article, name, and colors are editable. Profile length and panel thicknesses are fixed and read-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileCatalogUpdate"
      responses:
        "200":
          description: Updated profile metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileCatalogEntry"
        "400":
          description: Invalid kind, body, or read-only field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Manager session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Manager lacks products edit permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile kind not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Article is already assigned to another profile kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Catalog could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile-catalog/import-official:
    post:
      operationId: importOfficialProfileCatalog
      tags: [profile-catalog]
      summary: Insert missing official profile metadata
      description: Inserts only missing kinds and never overwrites existing manager-edited rows.
      responses:
        "200":
          description: Official metadata import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileCatalogImportResult"
        "401":
          description: Manager session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Manager lacks products edit permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An official article is already assigned to another profile kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Catalog could not be imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders:
    post:
      operationId: createOrder
      summary: Create a client order with a temporary PDF-only permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order; pdfToken is valid for 30 minutes and must not be persisted or logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCreated"
        "400":
          description: Invalid order
        "500":
          description: Order could not be created
  /orders/{id}/pdf-upload-url:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      operationId: requestOrderPdfUpload
      summary: Issue an upload URL only to the creator of an order without a saved PDF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPdfPermission"
      responses:
        "200":
          description: Upload URL and path-bound temporary permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPdfUpload"
        "400":
          description: Invalid order ID
        "403":
          description: Missing, expired or invalid creation permission
        "404":
          description: Order not found
        "409":
          description: PDF already saved; replacements are not allowed
        "500":
          description: Storage could not issue an upload URL
  /orders/{id}/pdf:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    patch:
      operationId: attachOrderPdf
      summary: Attach a verified uploaded PDF once using the order/path-bound permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPdfAttachment"
      responses:
        "200":
          description: PDF stored as an immutable copy and attached to the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPdfSaved"
        "400":
          description: Invalid ID or object path
        "403":
          description: Missing, expired or invalid upload permission
        "404":
          description: Order not found
        "409":
          description: PDF already saved; replacements are not allowed
        "422":
          description: Object missing or not a PDF (application/pdf, PDF signature, at most 15 MB)
        "500":
          description: PDF could not be saved
    get:
      operationId: downloadOrderPdf
      summary: Download the order PDF (manager session required)
      responses:
        "200":
          description: Stored PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid order ID
        "401":
          description: Manager session required
        "404":
          description: Order or saved PDF not found
        "500":
          description: PDF could not be read
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    ProfileKind:
      type: string
      enum: [connector, gap, light]
    ProfileColor:
      type: string
      enum: [black, gold, bronze, metallic]
    ProfileCatalogEntry:
      type: object
      additionalProperties: false
      required: [kind, article, name, colors, lengthMm, panelThicknessesMm, createdAt, updatedAt]
      properties:
        kind:
          $ref: "#/components/schemas/ProfileKind"
        article:
          type: string
        name:
          type: string
        colors:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ProfileColor"
        lengthMm:
          type: integer
          const: 3000
        panelThicknessesMm:
          type: array
          const: [5, 8]
          items:
            type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProfileCatalogUpdate:
      type: object
      additionalProperties: false
      required: [article, name, colors]
      properties:
        article:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 200
        colors:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ProfileColor"
    ProfileCatalogImportResult:
      type: object
      additionalProperties: false
      required: [imported, profiles]
      properties:
        imported:
          type: integer
          minimum: 0
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileCatalogEntry"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    OrderInput:
      type: object
      required: [prefix, zoneLabel, kpData]
      properties:
        prefix:
          type: string
          minLength: 1
        zoneLabel:
          type: string
          minLength: 1
        kpData:
          type: object
          additionalProperties: true
    OrderCreated:
      type: object
      required: [id, orderNumber, pdfToken]
      additionalProperties: true
      properties:
        id:
          type: integer
        orderNumber:
          type: string
        pdfToken:
          type: string
    OrderPdfPermission:
      type: object
      required: [pdfToken]
      properties:
        pdfToken:
          type: string
          maxLength: 2048
    OrderPdfUpload:
      type: object
      required: [uploadURL, objectPath, uploadToken]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        uploadToken:
          type: string
    OrderPdfAttachment:
      type: object
      required: [objectPath, uploadToken]
      properties:
        objectPath:
          type: string
          pattern: '^/objects/uploads/(order-pdfs/)?[a-f0-9-]{36}$'
        uploadToken:
          type: string
          maxLength: 2048
    OrderPdfSaved:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

